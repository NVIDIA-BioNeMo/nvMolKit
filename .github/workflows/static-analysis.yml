name: Static analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: colossus
    timeout-minutes: 45
    container:
      image: nvcr.io/nvidia/cuda:12.9.2-devel-ubuntu24.04

    steps:
      - name: Check out source tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install project dependencies
        shell: bash
        run: bash admin/ci/setup_dependencies.sh 3.12 2025.09.1

      - name: Install LLVM 22
        shell: bash
        run: |
          set -xeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gnupg wget
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | \
            gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" > \
            /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-22 \
            clang-tidy-22 \
            clang-tools-22 \
            libomp-22-dev
          clang++-22 --version
          clang-tidy-22 --version

      - name: Run clang-tidy
        shell: bash
        run: |
          set -xeuo pipefail
          # shellcheck source=/dev/null
          . /usr/local/anaconda/etc/profile.d/conda.sh
          conda activate base
          bash admin/run_clang_tidy.sh
